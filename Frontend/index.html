<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Attendance Kiosk</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 60px auto; padding: 0 20px; text-align: center; }
        video, img { width: 100%; border-radius: 8px; margin: 15px 0; }
        button { padding: 10px 20px; font-size: 15px; cursor: pointer; margin: 5px; }
        #status { font-size: 15px; color: #444; margin-top: 10px; }
        .result-card { border: 1px solid #ddd; border-radius: 6px; padding: 12px; margin-top: 10px; text-align: left; }
        .matched { border-left: 5px solid #2e7d32; }
        .unmatched { border-left: 5px solid #c62828; }
        a { display: block; margin-top: 30px; font-size: 13px; }
        hr { margin: 25px 0; border: none; border-top: 1px solid #ddd; }
    </style>
</head>
<body>
    <h1>Attendance Check-In</h1>
    <p id="status">Click "Start Camera" to begin.</p>

    <video id="video" autoplay style="display:none;"></video>
    <img id="captured-photo" style="display:none;">

    <button id="start-btn" onclick="startCamera()">Start Camera</button>
    <button id="capture-btn" onclick="captureAndRecognize()" style="display:none;">Capture & Check In</button>
    <button id="retake-btn" onclick="resetCamera()" style="display:none;">Retake</button>

    <hr>
    <p>Or upload a photo instead:</p>
    <input type="file" id="upload-input" accept="image/*">
    <button onclick="uploadAndRecognize()">Upload & Check In</button>

    <div id="results"></div>

    <a href="/admin">Admin Login →</a>

    <script>
        let currentStream = null;

        async function startCamera() {
            currentStream = await navigator.mediaDevices.getUserMedia({ video: true });
            const video = document.getElementById("video");
            video.srcObject = currentStream;
            video.style.display = "block";
            document.getElementById("captured-photo").style.display = "none";
            document.getElementById("start-btn").style.display = "none";
            document.getElementById("capture-btn").style.display = "inline-block";
            document.getElementById("status").textContent = "Camera active. Position your face and capture.";
        }

        function stopCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
        }

        function resetCamera() {
            document.getElementById("results").innerHTML = "";
            document.getElementById("retake-btn").style.display = "none";
            document.getElementById("captured-photo").style.display = "none";
            document.getElementById("status").textContent = "Click \"Start Camera\" to begin.";
            document.getElementById("start-btn").style.display = "inline-block";
        }

        function captureFrame() {
            const video = document.getElementById("video");
            const canvas = document.createElement("canvas");
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext("2d").drawImage(video, 0, 0);
            return new Promise((resolve) => canvas.toBlob((blob) => resolve(blob), "image/jpeg"));
        }

        async function captureAndRecognize() {
            const blob = await captureFrame();

            const photoUrl = URL.createObjectURL(blob);
            document.getElementById("captured-photo").src = photoUrl;
            document.getElementById("captured-photo").style.display = "block";
            document.getElementById("video").style.display = "none";
            stopCamera();

            document.getElementById("capture-btn").style.display = "none";
            document.getElementById("retake-btn").style.display = "inline-block";

            await sendToRecognize(blob);
        }

        async function uploadAndRecognize() {
            const fileInput = document.getElementById("upload-input");
            if (!fileInput.files.length) {
                alert("Please choose a photo first.");
                return;
            }
            const file = fileInput.files[0];

            document.getElementById("captured-photo").src = URL.createObjectURL(file);
            document.getElementById("captured-photo").style.display = "block";
            document.getElementById("video").style.display = "none";
            stopCamera();

            await sendToRecognize(file);
        }

        async function sendToRecognize(fileOrBlob) {
            document.getElementById("status").textContent = "Checking...";

            const formData = new FormData();
            formData.append("file", fileOrBlob, "capture.jpg");

            const response = await fetch("/recognize", { method: "POST", body: formData });
            const data = await response.json();

            document.getElementById("status").textContent = "Result:";
            const resultsDiv = document.getElementById("results");
            resultsDiv.innerHTML = "";
            data.results.forEach(r => {
                const card = document.createElement("div");
                card.className = "result-card " + (r.matched ? "matched" : "unmatched");
                card.textContent = r.matched
                    ? `✓ Welcome, ${r.name} (distance: ${r.distance.toFixed(3)})`
                    : `✗ Face not recognized (distance: ${r.distance.toFixed(3)})`;
                resultsDiv.appendChild(card);
            });
        }
    </script>
</body>
</html>
